services:
  - type: web
    name: legal-pack-processor
    env: node
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_WEBHOOK_URL
        sync: false
